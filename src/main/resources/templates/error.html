<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ApiWeather | Błąd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">AW</span>
            <span>ApiWeather</span>
        </a>
    </header>

    <section class="card panel error-card">
        <p class="eyebrow">Coś poszło nie tak</p>
        <h1 class="section-title">Nie udało się wyświetlić pogody.</h1>
        <p class="section-copy">
            Aplikacja działa dalej poprawnie, ale to konkretne żądanie nie mogło zostać obsłużone.
        </p>
        <div class="error-copy" th:text="${errorMessage}">Nie udało się pobrać danych pogodowych.</div>
        <div class="button-row">
            <a class="button button-primary" th:href="@{/}">Wróć do wyszukiwarki</a>
        </div>
    </section>
</main>
</body>
</html>
